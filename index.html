<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity -> PlayList Generator</title>

    <link rel="stylesheet" href="css/variable.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://kit.fontawesome.com/746a97fbea.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="heading-container">
      <img src="assets/images/song_beat.png" alt="" class="song-beat" />
      <div class="heading">
        <img
          src="assets/images/music_disk.png"
          class="music-disc"
          alt="music disk image"
        />
        <h1>Activity &rightarrow; PlayList Generator</h1>
      </div>
    </div>

    <div class="container">
      <div class="activity-input">
        <p>What do you feel like doing?</p>
        <div class="activity-input-field">
          <div class="input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="activityInput"
              placeholder="e.g., go to the gym, relax, code..."
              required
            />
          </div>
        </div>

        <div class="slider-container">
          <div class="slider-heading">
            <p>Number of Songs</p>
            <span
              ><p class="song-count">5</p>
              songs</span
            >
          </div>

          <div class="slider">
            <div class="slider-wrapper">
              <input type="range" min="5" max="10" value="5" id="slider" />
              <div class="slider-value" id="sliderValue"></div>
            </div>
          </div>
          <div class="ticks" id="tickContainer"></div>
          <p class="slider-label">Choose how many songs you want in your palylist.</p>
        </div>

        <div class="buttons">
          <button id="randomBtn" class="random-btn">
            <!-- <i class="fa-solid fa-dice"></i> -->
            <i class="fa-solid fa-dice"></i>
            Random Activity
          </button>
          <button id="generateBtn" class="generate-btn">
            <i class="fa-solid fa-music"></i>
            Generate Playlist
          </button>
        </div>
      </div>

      <div id="activityHolder"></div>
      <div class="result hidden" id="result"></div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
